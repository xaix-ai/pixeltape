<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PIXELTAPE · Inbox</title>
  <link rel="icon" href="icons/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html,body{height:auto;overflow:auto}
    .inbox{max-width:1100px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}
    .inbox-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .inbox-head h1{font-family:"Press Start 2P",monospace;font-size:18px;letter-spacing:2px;color:var(--shell-ink);margin:0}
    .inbox-head .sub{font-size:18px;color:var(--text-light)}
    .inbox-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .inbox-lock{max-width:420px;margin:60px auto;background:var(--cream);border:3px solid var(--shell-4);box-shadow:6px 6px 0 var(--shell-4);padding:22px}
    .inbox-lock p{font-size:19px;margin:0 0 12px}
    .inbox-lock input{width:100%;margin-bottom:12px}
    .inbox-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
    @media (max-width:820px){.inbox-grid{grid-template-columns:1fr}}
    .inbox-list{display:flex;flex-direction:column;gap:8px}
    .inbox-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;cursor:pointer;
      background:var(--cs-bg);border:2px solid var(--cs-edge);border-radius:5px;box-shadow:0 3px 0 var(--cs-shadow);color:inherit;font:inherit}
    .inbox-row[aria-current="true"]{outline:3px solid var(--shell-ink);outline-offset:2px}
    .inbox-row .lbl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--lb-bg);color:var(--lb-ink);padding:6px 8px;border-radius:3px}
    .inbox-row b{font-family:"Press Start 2P",monospace;font-weight:normal;font-size:7px;letter-spacing:1px;padding:3px 4px;background:var(--band);color:var(--band-ink);border-radius:2px}
    .inbox-row .who{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .inbox-row .msg{grid-column:1/-1;font-family:"Caveat",cursive;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .inbox-row .state{font-size:14px;letter-spacing:1px}
    .inbox-row .state.todo{color:rgb(200 50 40)}
    .inbox-empty{font-size:19px;color:var(--text-light);padding:30px 0;text-align:center}
    .inbox-detail{position:sticky;top:16px;background:var(--cream);border:3px solid var(--shell-4);box-shadow:6px 6px 0 var(--shell-4);padding:16px}
    .inbox-detail .meta{font-size:16px;color:var(--text-light);margin:10px 0}
    .inbox-detail textarea{width:100%}
    .inbox-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .inbox-detail .note-reply{margin-top:14px}
  </style>
</head>
<body data-shell="bubblegum">
  <main class="inbox">
    <div class="inbox-head">
      <div>
        <h1>PIXELTAPE · INBOX</h1>
        <div class="sub" id="inboxSub">Notes people sent from the app. Only you can open this.</div>
      </div>
      <div class="inbox-tools" id="inboxTools" hidden>
        <div class="saved-filter" id="inboxFilter"></div>
        <button class="pixel-button pixel-button-soft" id="refreshButton" type="button">↻ REFRESH</button>
        <button class="pixel-button pixel-button-soft" id="lockButton" type="button">LOCK</button>
      </div>
    </div>

    <form class="inbox-lock" id="lockForm" hidden>
      <p>Type your inbox key (the NOTES_ADMIN_KEY you saved in Netlify).</p>
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="inbox key" required>
      <button class="pixel-button" type="submit">OPEN INBOX</button>
    </form>

    <div class="inbox-grid" id="inboxGrid" hidden>
      <div class="inbox-list" id="inboxList"></div>
      <section class="inbox-detail" id="inboxDetail"></section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="inbox.js"></script>
</body>
</html>
