# Builds the Mac and Windows apps on GitHub's computers and puts them in a GitHub Release.
# Press "Run workflow" on the Actions tab (or push a version tag like v0.6.0).
# 1) makes a draft release for the version in package.json, 2) builds both apps into it,
# 3) publishes the release, so the website's download buttons pick it up.
name: Desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets the build create the release and upload the files

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Make a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, the new files will replace the old ones."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "PIXELTAPE ${TAG#v}" --notes "Download PIXELTAPE-mac.dmg for Mac or PIXELTAPE-windows.exe for Windows."
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build and upload
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no paid code-signing certificate (yet)

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
